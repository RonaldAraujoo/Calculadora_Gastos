<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Controle de Despesas</h1>
        <nav>
            <button id="menu-btn">☰</button>
            <div class="menu">
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section id="controle">

        <!-- Campo para renda mensal -->
        <label for="renda">Informe sua Renda Mensal:</label>
        <input type="number" id="renda" placeholder="Renda Mensal" required>
        
        <p id="restante">Renda disponível após despesas: R$ 0.00</p>

        <!-- Formulário para adicionar despesas -->
        <form id="despesa-form">
            <input type="text" id="descricao" placeholder="Descrição da Despesa (ex: lazer, casamento...)" required>
            <input type="number" id="valor" placeholder="Valor da Despesa" required>
            <button type="submit">Adicionar Despesa</button>
        </form>

        <!-- Lista de despesas -->
        <ul id="lista-despesas"></ul>
    </section>

    <footer>
        <p>&copy; 2025 Controle de Despesas. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
